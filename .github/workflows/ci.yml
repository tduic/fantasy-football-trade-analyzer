name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","linux","ARM64","tduic-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in index.js sleeper/*.js; do node --check "$f"; done
      - name: Tests (Sleeper API is mocked)
        run: npm test
